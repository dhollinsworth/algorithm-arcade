<style>

.br,.stage{background:var(--pan);border:4px solid var(--s);border-radius:12px;padding:18px;min-width:0}
.tg{color:var(--m);font:.6rem 'Press Start 2P',monospace}
h2{font-size:1.35rem;margin:10px 0 14px}

.bk{display:inline-block;vertical-align:top;width:calc(50% - 6px);margin:0 0 8px;border:3px dashed var(--y);border-radius:10px;padding:6px;min-height:80px;cursor:pointer}

.chip{background:var(--s);color:var(--ink);border:0;border-radius:20px;padding:8px 12px;margin:4px;font-weight:900;box-shadow:0 3px 0 #1d7c9a}
.chip.sel{background:var(--y);transform:scale(1.07)}.chip.done{background:var(--m);box-shadow:none;animation:pop .3s}

.stars{font-size:3rem;letter-spacing:8px}.stars i{display:inline-block;animation:bob 1s infinite;font-style:normal}
.float{position:fixed;color:var(--y);font:1rem 'Press Start 2P',monospace;pointer-events:none;animation:up 1s forwards;z-index:10}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.center{text-align:center;padding:5vh 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  $('#go').onclick=e=>{if(r.ok(v)){ctl.querySelectorAll('input,button').forEach(x=>x.disabled=true);done(true,e)}else{miss(e);fb(false,'Not quite. '+r.why)}}}
 function ans(ok,e,j){clearInterval(timer);ctl.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(+b.dataset.j==r.a)b.classList.add('ok');else if(+b.dataset.j==j)b.classList.add('no')});
  pp.innerHTML=r.o[j<0?r.a:j][1];fb(ok,(ok?'Yes! ':j<0?'Time’s up! ':'Not quite. ')+r.why);if(!ok){pp.classList.add('shake');setTimeout(()=>{pp.innerHTML=r.o[r.a][1]},900)}ok?hit(e):miss(e);done(ok,e,1)}
 function done(ok,e,solved){if(G.hp<=0)return;if(!solved)hit(e);nx(ok||solved)}
 function fb(ok,t){$('#fb').className='fb '+(ok?'':'bad');$('#fb').textContent=t}
 function nx(){$('#nx').innerHTML=`<button class=btn id=nb>${G.k+1==G.r.length?'Finish level ▶':'Next ▶'}</button>`;$('#nb').focus();$('#nb').onclick=()=>{G.k++;round()}}
}
const cheer=['Layout magic!','Print-ready!','The editor is thrilled!','Byte approves!','Crispy formatting!'],oops=['Yikes, ink everywhere!','Byte is sweating…','Check the brief again!','Stop the presses!'];
function hit(e){const p=10*(1+Math.min(G.combo,4));G.combo++;G.xp+=p;good();burst(30,e&&e.clientX,e&&e.clientY);pop('+'+p,e);say(cheer[Math.random()*cheer.length|0]);const h=$('.hud b');if(h)h.textContent=S.xp+G.xp}
function miss(e){G.hp--;G.combo=0;bad();say(oops[Math.random()*oops.length|0]);const w=$('.wb');if(w){w.classList.add('shake');setTimeout(()=>w.classList.remove('shake'),400)}if(G.hp<=0){clearInterval(timer);setTimeout(fail,900)}}
function fail(){clearInterval(timer);app.innerHTML=hud()+`<div class=center><span class=big>😵</span><h1 class=px style="font-size:1.4rem;color:var(--c)">OUT OF LIVES</h1><p>The ink ran dry. XP from this try still counts.</p><button class=btn onclick="S.xp+=G.xp;save();play(${G.i})">↻ Try again</button> <button class="btn alt" onclick="S.xp+=G.xp;save();map()">Map</button></div>`}
function finish(){const st=G.hp>=3?3:G.hp==2?2:1;S.st[G.i]=Math.max(S.st[G.i]||0,st);S.xp+=G.xp;save();win();burst(160);const all=L.every((_,j)=>S.st[j]),next=G.i+1<L.length&&(G.i+1<5||L.slice(0,5).every((_,j)=>S.st[j]));
 app.innerHTML=hud()+`<div class=center><span class=big>${L[G.i].boss?'🏆':'🎉'}</span><h1 class=px style="font-size:1.4rem;color:var(--y)">${L[G.i].boss?'ISSUE PRINTED!':'LEVEL CLEAR!'}</h1><div class=stars>${[0,1,2].map(i=>`<i style="animation-delay:${i*.2}s">${i<st?'⭐':'☆'}</i>`).join('')}</div><p>+${G.xp} XP · Rank: <b>${rank(S.xp)}</b></p>${all?'<p>You rescued every desk. The editor is speechless.</p>':''}${next?`<button class=btn onclick="play(${G.i+1})">Next level ▶</button> `:''}<button class="btn alt" onclick="map()">Map</button></div>`}
title();
</script></body></html>
